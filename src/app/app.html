<div appSparkleCursor class="rz-shell" [class.rz-desktop]="showChrome()">
  @if (showChrome()) {
    <nav class="rz-nav">
      <a class="rz-nav__brand" routerLink="/">rozenet<span class="rz-spark"> ✦</span></a>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">home</a>
      <a routerLink="/links" routerLinkActive="active">links</a>
      <a routerLink="/forum" routerLinkActive="active">forum</a>

      <span class="rz-nav__crumb">
        @if (onForum() && auth.user(); as me) {
          signed in: <b>{{ me.username }}</b>@if (me.isAdmin) { [mod] } ·
          <a href="#" (click)="$event.preventDefault(); logout()">log out</a>
        } @else {
          {{ crumb() }}
        }
      </span>
    </nav>
  }

  <main>
    <router-outlet />
  </main>

  @if (showChrome()) {
    <footer class="rz-footer">
      <div class="rz-footer__ring">
        <a routerLink="/">« home</a>
        <span class="rz-spark">✦</span>
        <a routerLink="/links">links</a>
        <span class="rz-spark">✦</span>
        <a routerLink="/forum">forum »</a>
      </div>
      <p>made with <span class="rz-spark">♥</span> by roze</p>
      <p class="mono">you were never in control of this page</p>
    </footer>
  }
</div>
